name: Auto Checkout

on:
  schedule:
    - cron: "30 8 * * *"    # 2:00 PM IST (08:30 UTC)
    - cron: "30 17 * * *"   # 11:00 PM IST (17:30 UTC)
    - cron: "30 22 * * *"   # 4:00 AM IST (22:30 UTC)
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  auto-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-checkout
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://yosfitnessstudio.in/api/cron/auto-checkout" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "Response: $response"
          if [ "$response" != "200" ]; then
            echo "Unexpected status: $response"
            exit 1
          fi
